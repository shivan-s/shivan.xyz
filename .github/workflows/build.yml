name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup
        uses: pnpm/setup@v3.2.0
        with:
          require-lockfile: true
          cache: true
      - name: Build
        run: pnpm run build
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup
        uses: pnpm/setup@v3.2.0
        with:
          require-lockfile: true
          cache: true
      - name: Lint
        run: npm run lint
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Setup
        uses: pnpm/setup@v3.2.0
        with:
          require-lockfile: true
          cache: true
      - name: Compile Messages
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Check
        run: npm run check
